app-id: org.yours.mail
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: yours
separate-locales: false

# One bundle for every Flatpak-capable distribution. Crates come from the
# vendored sources generated from the committed lockfile:
#
#   flatpak-cargo-generator -d Cargo.lock \
#       -o packaging/flatpak/cargo-sources.json
#
# Refresh that file whenever Cargo.lock changes; scripts/test-release.py checks
# that it still matches the lockfile.
#
# The app uses portals for browser, file-picker, background and notification
# requests. The `flatpak` feature sends new-mail notifications through
# org.freedesktop.portal.Notification, so the sandbox needs no notification
# D-Bus name. Credential storage uses the freedesktop Secret Service on the
# session bus; the feature also disables the legacy StatusNotifier tray backend
# so the sandbox needs no unsafe D-Bus name. Docks that show the unread count on
# the icon own com.canonical.Unity; the count is a broadcast that needs no
# permission, and the name only tells the app when a dock (re)starts, to send it
# again.
finish-args:
  - --share=ipc
  # Mail sync, OAuth, and the local Reacher service on 127.0.0.1:8084 use the
  # host network namespace. With an isolated network, 127.0.0.1 would name the
  # sandbox itself and Reacher checks would fail.
  - --share=network
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  # GNOME Keyring, KWallet and KeePassXC all answer org.freedesktop.secrets.
  # Reaching the host collection is what keeps credentials across native and
  # Flatpak installs.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=com.canonical.Unity

# No --filesystem is needed for the profile. The app keeps durable state in
# $XDG_DATA_HOME/yours-mail, which inside the sandbox is
# ~/.var/app/org.yours.mail/data/yours-mail and is writable by default. Files
# the user picks, including PDF attachments, arrive through the document portal.
# To import a native install's profile, copy it into that directory (or grant
# --filesystem=xdg-data/yours-mail with flatpak override); see
# docs/packaging.md.

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

modules:
  - name: flectar-mail
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_BUILD_JOBS: '1'
        CARGO_HOME: /run/build/flectar-mail/cargo
        CARGO_NET_OFFLINE: 'true'
        # The bundle on GitHub tells of newer releases. Flathub updates the
        # app itself, so its manifest leaves this out.
        FLECTAR_UPDATE_CHECKS: github
    build-commands:
      - cargo build --offline --locked --release --no-default-features --features remote-content,gpu-renderer,flatpak --bin yours
      - install -Dm0755 target/release/yours /app/bin/yours
      - install -Dm0755 pdfium-runtime/lib/libpdfium.so /app/lib/flectar-mail/libpdfium.so
      - python3 scripts/test-pdf-preview.py /app/bin/yours
      - python3 scripts/linux-elf.py verify /app/bin/yours /app/lib/flectar-mail
      - python3 scripts/stage-linux-metadata.py --flatpak _flatpak-stage
      - install -Dm0644 _flatpak-stage/usr/share/applications/org.yours.mail.desktop /app/share/applications/org.yours.mail.desktop
      - install -Dm0644 _flatpak-stage/usr/share/metainfo/org.yours.mail.metainfo.xml /app/share/metainfo/org.yours.mail.metainfo.xml
      - install -Dm0644 resources/app-icon/icon-seal-512.png /app/share/icons/hicolor/512x512/apps/org.yours.mail.png
      - install -Dm0644 resources/app-icon/icon-seal.svg /app/share/icons/hicolor/scalable/apps/org.yours.mail.svg
      - install -Dm0644 LICENSE /app/share/licenses/flectar-mail/LICENSE
      - cp -a LICENSES /app/share/licenses/flectar-mail/LICENSES
      - install -Dm0644 THIRD_PARTY_NOTICES.md /app/share/doc/flectar-mail/THIRD_PARTY_NOTICES.md
      - install -Dm0644 resources/fonts/google-sans-flex/OFL.txt /app/share/licenses/flectar-mail/google-sans-flex/OFL.txt
      - install -Dm0644 resources/fonts/google-sans-flex/README.md /app/share/doc/flectar-mail/google-sans-flex/README.md
      - mkdir -p /app/share/licenses/flectar-mail/pdfium
      - cp -a pdfium-runtime/LICENSE pdfium-runtime/licenses /app/share/licenses/flectar-mail/pdfium/
    sources:
      # Package the exact checkout selected by the release workflow.
      - type: dir
        path: ../..
        skip:
          - .artifacts
          - .devcontainer
          - .env
          - .flatpak-builder
          - .git
          - .idea
          - .Trash-*
          - .vscode
          - libs
          - target
          - tmp
      - cargo-sources.json
      # Include PDF preview in the standalone alpha bundle. These are the
      # archives scripts/stage-pdfium.py pins for linux-x64 and linux-arm64.
      - type: archive
        url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8044/pdfium-linux-x64.tgz
        sha256: eb142f416aed3a72fc5a02dbd5884868a16cb99dc0cf53e6bdd64afbf67b05f4
        dest: pdfium-runtime
        strip-components: 0
        only-arches:
          - x86_64
      - type: archive
        url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8044/pdfium-linux-arm64.tgz
        sha256: e98400ef5f005f27cfba5c14f72d464e25187298f04950de46646033cf24cef0
        dest: pdfium-runtime
        strip-components: 0
        only-arches:
          - aarch64
